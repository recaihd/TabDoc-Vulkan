<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabDoc - Verificador de Compatibilidade Vulkan 1.3</title>
    <link rel="icon" href="./assets/icone-site.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Minecraft Vulkan 1.3</h1>
            <p>Descubra se o seu computador é compatível com a nova versão do jogo</p>
        </header>

        <main>
            <form id="checker-form">
                <div class="input-group">
                    <label for="gpu">Placa de Vídeo (GPU):</label>
                    <div class="custom-select-wrapper">
                        <input type="text" id="gpu" placeholder="Digite para buscar sua GPU..." autocomplete="off" required>
                        <div id="gpu-dropdown" class="dropdown-menu hidden"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="ram">Memória RAM (GB):</label>
                    <select id="ram" required>
                        <option value="" disabled selected>Selecione a quantidade...</option>
                        <option value="2">2 GB</option>
                        <option value="4">4 GB</option>
                        <option value="8">8 GB</option>
                        <option value="16">16 GB</option>
                        <option value="32">32 GB</option>
                        <option value="64">64 GB ou mais</option>
                    </select>
                </div>

                <button type="submit" id="btn-check">Verificar Compatibilidade</button>
            </form>

            <div id="result" class="result-card hidden">
                <h2 id="result-title"></h2>
                <p id="result-message"></p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
